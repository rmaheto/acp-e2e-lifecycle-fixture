<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find an artwork</title>
  <link rel="stylesheet" href="/artwork-search.css">
  <script src="/artwork-search.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Artwork collection</p>
      <h1>Find an artwork</h1>
      <p>Search by artist, title, medium, or price. Leave a field blank if it does not matter.</p>
    </header>
    <section class="search-panel" aria-labelledby="search-heading">
      <h2 id="search-heading">Your search</h2>
      <form id="search-form">
        <div class="fields">
          <div class="field"><label for="artist">Artist</label><input id="artist" name="artist" type="search" autocomplete="off" placeholder="e.g. Claude Monet"></div>
          <div class="field"><label for="title">Artwork title</label><input id="title" name="title" type="search" autocomplete="off" placeholder="e.g. Water Lilies"></div>
          <div class="field"><label for="medium">Medium</label><input id="medium" name="medium" type="search" autocomplete="off" placeholder="e.g. Oil on canvas"></div>
          <div class="field price-fields">
            <label for="minPrice">Minimum price</label><input id="minPrice" name="minPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="No minimum">
          </div>
          <div class="field price-fields">
            <label for="maxPrice">Maximum price</label><input id="maxPrice" name="maxPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="No maximum">
          </div>
        </div>
        <button type="submit">Search artworks</button>
      </form>
    </section>
    <section class="results" aria-labelledby="results-heading">
      <h2 id="results-heading">Search results</h2>
      <p id="status" role="status" aria-live="polite">Enter any search details and select Search artworks.</p>
      <ul id="results-list" class="artwork-list"></ul>
    </section>
  </main>
</body>
</html>
